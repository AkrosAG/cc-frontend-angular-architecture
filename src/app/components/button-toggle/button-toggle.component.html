<mat-button-toggle-group name="toggleGroup" aria-label="Toggle Group">
  @if (buttonToggleValues) {
    @for (button of buttonToggleValues; track button.label) {
      <mat-button-toggle [checked]="toggleValue === button.value">{{button.label}}</mat-button-toggle>
    }
  } @else {
    <span class="no-data">No values for the Button Toggle</span>
  }
</mat-button-toggle-group>
