<h1>My Snippets</h1>
<form class="add-snippet" [formGroup]="addSnippetForm" (submit)="onSubmit()">
  <span>Add Snippet</span>
  <input type="text" placeholder="title" formControlName="title" />
  <textarea placeholder="Content" formControlName="content"></textarea>
  <input type="submit" value="Save" [disabled]="!addSnippetForm.valid" />
</form>
<div class="snippets-container">
  @for (snippet of snippets; track snippet) {
    <app-snippet [snippet]="snippet"/>
  }
</div>
