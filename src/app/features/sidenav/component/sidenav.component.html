<ul>
  @for (item of navItems; track item.id) {
    <li
      (click)="onItemSelect(item)"
      [ngClass]="{ selected: activeItem.id === item.id }"
    >
      {{ item.label }}
    </li>
    @if (item.items) {
      @for (item of item.items; track item.id) {
        <li
          class="sub-item"
          (click)="onItemSelect(item)"
          [ngClass]="{ selected: activeItem.id === item.id }"
        >
          {{ item.label }}
        </li>
      }
    }
  }
</ul>
