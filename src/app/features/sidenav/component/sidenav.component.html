<ul>
  <ng-container *ngFor="let item of navItems">
    <li
      (click)="onItemSelect(item)"
      [ngClass]="{ selected: activeItem.id === item.id }"
    >
      {{ item.label }}
    </li>
    <ng-container *ngIf="item.items">
      <li
        *ngFor="let item of item.items"
        class="sub-item"
        (click)="onItemSelect(item)"
        [ngClass]="{ selected: activeItem.id === item.id }"
      >
        {{ item.label }}
      </li>
    </ng-container>
  </ng-container>
</ul>
